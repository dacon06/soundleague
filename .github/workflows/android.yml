# Baut die Android-App und veröffentlicht sie als Release (für Obtainium).
# Läuft nur, wenn sich etwas an der App selbst ändert. Änderungen an der Website
# brauchen keine neue APK, weil die App die Website direkt lädt.
name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prüfen, ob die Geheimnisse eingetragen sind
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Das Secret KEYSTORE_BASE64 fehlt. Bitte unter Settings > Secrets and variables > Actions eintragen und dann 'Run workflow' starten."
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Das Secret GOOGLE_SERVICES_JSON fehlt. Die App wird gebaut, aber Push-Benachrichtigungen funktionieren nicht."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Website bauen und in die App kopieren
        run: |
          npm ci
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Schlüssel und Firebase-Datei bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/soundleague.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Soundleague 1.0.${{ github.run_number }}
          body: Automatisch gebaut aus dem letzten Stand.
          files: android/app/build/outputs/apk/release/soundleague.apk
