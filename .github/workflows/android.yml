# Baut die native Android-App (Ordner android-native) und veröffentlicht sie als Release (für Obtainium).
# Läuft, wenn sich etwas an der App ändert, oder per Hand über „Run workflow".
name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prüfen, ob die Geheimnisse eingetragen sind
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Das Secret KEYSTORE_BASE64 fehlt (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Das Secret GOOGLE_SERVICES_JSON fehlt. Die native App braucht es für Login und Datenbank."
            exit 1
          fi
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::warning::Das Secret YOUTUBE_API_KEY fehlt. Die App wird gebaut, aber die Song-Suche funktioniert nicht."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Schlüssel und Firebase-Datei bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android-native/app/release.keystore
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-native/app/google-services.json

      - name: APK bauen
        working-directory: android-native
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/soundleague.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Soundleague 2.0.${{ github.run_number }} (native)
          body: Automatisch gebaut aus dem letzten Stand der nativen App.
          files: android-native/app/build/outputs/apk/release/soundleague.apk
